<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimienta Kids - Gestión de Salidas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        
        <!-- FORMULARIO DE REGISTRO (IZQUIERDA) -->
        <div class="form-card">
            <div class="form-header">
                <h2>Nuevo Registro</h2>
                <p>Ingrese los datos de la salida del taller</p>
            </div>

            <form id="formSalida">
                <div class="input-group">
                    <label for="nombrePrenda">Nombre de la Prenda</label>
                    <input type="text" id="nombrePrenda" placeholder="Ej. Cafarena, Vestido..." required>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="tallaPrenda">Talla</label>
                        <input type="text" id="tallaPrenda" placeholder="Ej. 6, 8, S..." required>
                    </div>
                    <div class="input-group">
                        <label for="colorPrenda">Color</label>
                        <input type="text" id="colorPrenda" placeholder="Ej. Rojo, Azul..." required>
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="cantidadPrenda">Cantidad</label>
                        <input type="number" id="cantidadPrenda" min="1" value="1" required>
                    </div>
                    <div class="input-group">
                        <label for="fotoPrenda">Foto Muestra</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="fotoPrenda" accept="image/*">
                            <div class="file-upload-box">Subir Foto</div>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="obsPrenda">Observaciones / Detalles</label>
                    <textarea id="obsPrenda" rows="2" placeholder="Detalles adicionales..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Agregar a la Lista</button>
            </form>
        </div>

        <!-- VISTA PREVIA DEL COMPROBANTE (DERECHA) -->
        <div class="preview-card">
            <div class="comprobante-canvas" id="comprobanteArea">
                
                <!-- CABECERA VIDRIOSA Y LUMINOSA -->
                <div class="comprobante-header">
                    <div class="brand-logo">
                        <h1>Pimienta Kids</h1>
                        <span class="brand-sub">GESTIÓN & SISTEMA</span>
                    </div>
                    <div class="status-badge">✓ REGISTRO EXITOSO</div>
                    <div class="document-title">COMPROBANTE DE PRODUCCIÓN</div>
                    <div class="document-date" id="fechaActual">miércoles, 2 de setiembre de 2026</div>
                </div>

                <div class="ticket-divider"></div>

                <!-- TABLA OPTIMIZADA (FOTO + NOMBRE / TALLA / CANTIDAD / DETALLES) -->
                <div class="table-responsive">
                    <table class="production-table">
                        <thead>
                            <tr>
                                <th style="width: 28%;">MUESTRA</th>
                                <th style="width: 15%;">TALLA</th>
                                <th style="width: 15%;">CANT.</th>
                                <th style="width: 42%;">DETALLES Y DESCRIPCIÓN</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo">
                            <tr>
                                <td colspan="4" class="empty-state">No hay registros agregados aún.</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr id="filaTotalGeneral">
                                <td colspan="2">TOTAL GENERAL:</td>
                                <td id="totalCantidad" class="col-cantidad">0</td>
                                <td>prendas de salida</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

            </div>

            <!-- BOTONES DE ACCIÓN INFERIORES -->
            <div class="action-bar">
                <button id="btnDescargar" class="btn-download" disabled>Descargar Comprobante</button>
                <button id="btnLimpiar" class="btn-secondary">Limpiar Todo</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
