<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pimienta Kids - Comprobante de Producción</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <!-- SECCIÓN 1: NUEVO REGISTRO -->
        <section class="card form-card">
            <h2>Nuevo Registro</h2>
            <p class="subtitle">Ingrese los datos de la salida del taller</p>

            <form id="formSalida">
                <div class="input-group">
                    <label for="nombrePrenda">Nombre de la Prenda</label>
                    <input type="text" id="nombrePrenda" placeholder="Ej. Cafarena" required>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="tallaPrenda">Talla</label>
                        <input type="text" id="tallaPrenda" placeholder="Ej. 12" required>
                    </div>
                    <div class="input-group">
                        <label for="colorPrenda">Color</label>
                        <input type="text" id="colorPrenda" placeholder="Ej. Lila" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="cantidadPrenda">Cantidad</label>
                        <input type="number" id="cantidadPrenda" min="1" value="1" required>
                    </div>
                    <div class="input-group">
                        <label>Foto Muestra</label>
                        <label for="fotoPrenda" class="file-upload-btn">
                            <span>Subir Foto</span>
                        </label>
                        <input type="file" id="fotoPrenda" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="input-group">
                    <label for="obsPrenda">Observaciones / Detalles</label>
                    <textarea id="obsPrenda" placeholder="Ej. Detalles especiales, botones, etc."></textarea>
                </div>

                <button type="submit" id="btnAgregar" class="btn-primary">Agregar a la Lista</button>
            </form>
        </section>

        <!-- SECCIÓN 2: COMPROBANTE DE PRODUCCIÓN -->
        <section class="card receipt-card">
            <div class="receipt-header">
                <h2>Pimienta Kids</h2>
                <div class="badge-success">✓ REGISTRO EXITOSO</div>
                
                <h3>COMPROBANTE DE PRODUCCIÓN</h3>
                <p id="fechaActual" class="receipt-date"></p>
            </div>

            <div class="table-container">
                <table class="receipt-table">
                    <thead>
                        <tr>
                            <th>MUESTRA</th>
                            <th>TALLA</th>
                            <th>CANT.</th>
                            <th>DETALLES Y DESCRIPCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo">
                        <tr>
                            <td colspan="4" class="empty-state">No hay registros agregados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="total-general-box">
                <span>TOTAL GENERAL:</span>
                <div>
                    <strong id="totalCantidad">0</strong> <span>prendas de salida</span>
                </div>
            </div>
        </section>

        <!-- ACCIONES FINALES -->
        <div class="actions-footer">
            <button id="btnDescargar" class="btn-secondary" disabled>Descargar Comprobante</button>
            <button id="btnLimpiar" class="btn-danger-outline">Limpiar Todo</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
